name: Release
permissions:
  contents: read
on:
  push:
    branches:
      - main
    paths:
      - packages/**
      - .github/**
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ['gateway', 'rest', 'types', 'utils', 'bot', 'discordeno']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: build Package
        run: yarn release-build --filter=./packages/${{ matrix.package }}
      - name: Bump Package Version
        if: ${{ github.event_name != 'release' && github.event.action != 'published' }}
        run: node ./scripts/bumpVersionByCommit.js ${{ matrix.package }}
      - run: yarn pack
        working-directory: packages/${{ matrix.package }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/package.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ['gateway', 'rest', 'types', 'utils', 'bot', 'discordeno']
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.package }}

      # If the action is running from a release, if prerelease use beta tag else use latest tag, otherwise use the next tag
      - run: npm publish package.tgz --tag ${{ github.event_name == 'release' && github.event.action == 'published' && (github.event.release.prerelease && 'beta' || 'latest') || 'next' }} --access public --provenance --ignore-scripts
